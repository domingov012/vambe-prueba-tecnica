# Local review setup (docker-compose): nginx serves the built SPA and proxies
# /api to the backend container, so the browser stays same-origin and the
# frontend's relative `/api/*` URLs (frontend/src/api.js) work untouched — no
# CORS needed. The single-image deploy skips nginx and lets FastAPI serve the
# same assets; see the top of the repo Dockerfile.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # CSV uploads are the one large request body here; the 10k-row sample is
    # a couple of MB. nginx's 1m default would 413 it.
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enrichment runs on the backend's background queue rather than in the
        # request, but parsing + validating a whole CSV is synchronous and a
        # large upload can outlast the 60s default.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # Vite emits content-hashed filenames, so these are safe to pin forever.
    # One directive, not `expires 1y` plus an add_header — those emit two
    # separate Cache-Control headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
